[keys]
quit             = "esc"

# Global
zoom_in           = "-"
zoom_out          = "="
height_decrease   = "{"
height_increase   = "}"
latency_decrease  = "["
latency_increase  = "]"
palette_cycle     = "p"
vinyl_mode_toggle  = "`"
art_cycle         = "/"
help              = "?"
nudge_mode_toggle = "¬"
fps_increase      = "^"
fps_decrease      = "Y"

# Deck select
select_deck1 = "alt+1"
select_deck2 = "alt+2"
select_deck3 = "alt+3"
# Cycle the selected deck (Zellij-style): down/right advance, up/left retreat
select_next_deck = ["alt+down", "alt+right"]
select_prev_deck = ["alt+up", "alt+left"]

# Transport / browse (selected deck)
play_pause   = "alt+g"
open_browser = "alt+f"

# Pitch (selected deck)
pitch_up    = "a"
pitch_down  = "z"
pitch_reset = ["alt+a", "alt+z"]

# BPM (selected deck)
bpm_tap          = "b"
detect_bpm       = "alt+b"
metronome_toggle = "alt+v"

# Loop mode (PoC: deck 3 only)
loop_tap   = "g"
loop_exit  = "H"
bpm_increase     = "v"
bpm_decrease     = "f"
base_bpm_increase = "V"
base_bpm_decrease = "F"
speed_reset      = "alt+c"

# Nudge (selected deck)
nudge_forward  = "d"
nudge_backward = "c"

# Tick offset (selected deck)
offset_increase = "D"
offset_decrease = "C"

# Cue (selected deck)
cue      = "B"
cue_play = "G"

# PFL (selected deck)
pfl_up     = "s"
pfl_down   = "x"
pfl_reset  = ["alt+s", "alt+x"]
pfl_on_off = "alt+d"

# Beat jumps (selected deck)
jump_forward_1bt  = "1"
jump_backward_1bt = "q"
jump_forward_1b   = "2"
jump_backward_1b  = "w"
jump_forward_4b   = "3"
jump_backward_4b  = "e"
jump_forward_8b   = "4"
jump_backward_8b  = "r"
jump_forward_16b  = "5"
jump_backward_16b = "t"
jump_forward_32b  = "$"
jump_backward_32b = "R"
jump_forward_64b  = "%"
jump_backward_64b = "T"

# Mixer — Deck 1
deck1_level_up          = "j"
deck1_level_down        = "m"
deck1_level_max         = "alt+j"
deck1_level_min         = "alt+m"
deck1_gain_increase     = "J"
deck1_gain_decrease     = "M"
deck1_filter_increase        = "7"
deck1_filter_decrease        = "u"
deck1_filter_reset           = ["alt+7", "alt+u"]
deck1_filter_slope_increase  = "&"
deck1_filter_slope_decrease  = "U"

# Mixer — Deck 2
deck2_level_up          = "k"
deck2_level_down        = ","
deck2_level_max         = "alt+k"
deck2_level_min         = "alt+,"
deck2_gain_increase     = "K"
deck2_gain_decrease     = "<"
deck2_filter_increase        = "8"
deck2_filter_decrease        = "i"
deck2_filter_reset           = ["alt+8", "alt+i"]
deck2_filter_slope_increase  = "*"
deck2_filter_slope_decrease  = "I"

# Mixer — Deck 3
deck3_level_up          = "l"
deck3_level_down        = "."
deck3_level_max         = "alt+l"
deck3_level_min         = "alt+."
deck3_gain_increase     = "L"
deck3_gain_decrease     = ">"
deck3_filter_increase        = "9"
deck3_filter_decrease        = "o"
deck3_filter_reset           = ["alt+9", "alt+o"]
deck3_filter_slope_increase  = "("
deck3_filter_slope_decrease  = "O"

# Deck swap
swap_deck1_deck2 = "alt+="
swap_deck2_deck3 = "alt+-"

[display]
playhead_position = 20        # 0–100, percentage from left edge of detail panel
warning_threshold_secs = 30   # seconds before end to activate bar-marker flash warning
detail_height = 5             # total rows per detail waveform (including 2-row tick area; min 4)
# target_fps = 60             # frame rate cap; snapped to nearest level: 15, 20, 24, 30, 45, 60, 90, 120, 240
