[keys]
quit             = "esc"

# Global
zoom_in           = "-"
zoom_out          = "="
height_decrease   = "{"
height_increase   = "}"
latency_decrease  = "["
latency_increase  = "]"
mode_cycle        = "`"
grid_mode         = "g"
art_cycle         = "/"
help              = "?"
message_history   = "N"
nudge_mode_toggle = "¬"
fps_increase      = "^"
fps_decrease      = "Y"

# Deck select — Zellij-style cycling on the fresh Alt layer
select_next_deck = ["alt+j", "alt+down"]
select_prev_deck = ["alt+k", "alt+up"]
# Reload the decks as they were when deck last ran (offered while all decks are empty)
session_restore  = "alt+r"
# Browser panel resize (browser open only); divider left widens the panel
panel_widen  = ["alt+h", "alt+left"]
panel_narrow = ["alt+l", "alt+right"]
# Skip the selected deck's playlist to the next / previous track
playlist_next = "space+n"
playlist_prev = "space+p"

# Transport / browse (selected deck)
play_pause   = "space+g"
open_browser = "space+f"

# Pitch (selected deck)
pitch_up    = "a"
pitch_down  = "z"
pitch_reset = ["space+a", "space+z"]

# BPM (selected deck)
bpm_tap          = "b"
metronome_toggle = "space+v"

bpm_increase     = "v"
bpm_decrease     = "f"
base_bpm_increase = "V"
base_bpm_decrease = "F"
speed_reset      = "space+c"

# Nudge (selected deck)
nudge_forward  = "d"
nudge_backward = "c"

# Tick offset (selected deck)
offset_increase = "D"
offset_decrease = "C"

# Cue (selected deck)
cue      = "B"
cue_play = "G"

# PFL (selected deck)
pfl_up     = "s"
pfl_down   = "x"
pfl_reset  = ["space+s", "space+x"]
pfl_on_off = "space+d"

# Beat jumps (selected deck)
jump_forward_1bt  = "1"
jump_backward_1bt = "q"
jump_forward_1b   = "2"
jump_backward_1b  = "w"
jump_forward_4b   = "3"
jump_backward_4b  = "e"
jump_forward_8b   = "4"
jump_backward_8b  = "r"
jump_forward_16b  = "5"
jump_backward_16b = "t"
jump_forward_32b  = "$"
jump_backward_32b = "R"
jump_forward_64b  = "%"
jump_backward_64b = "T"
# Ghost playheads: key labels at each jump key's landing (Beat mode)
ghosts_toggle     = "!"

# Mixer — Deck 1
deck1_level_up          = "j"
deck1_level_down        = "m"
deck1_level_max         = "space+j"
deck1_level_min         = "space+m"
deck1_gain_increase     = "J"
deck1_gain_decrease     = "M"
deck1_filter_increase        = "7"
deck1_filter_decrease        = "u"
deck1_filter_reset           = ["space+7", "space+u"]
deck1_filter_slope_increase  = "&"
deck1_filter_slope_decrease  = "U"

# Mixer — Deck 2
deck2_level_up          = "k"
deck2_level_down        = ","
deck2_level_max         = "space+k"
deck2_level_min         = "space+,"
deck2_gain_increase     = "K"
deck2_gain_decrease     = "<"
deck2_filter_increase        = "8"
deck2_filter_decrease        = "i"
deck2_filter_reset           = ["space+8", "space+i"]
deck2_filter_slope_increase  = "*"
deck2_filter_slope_decrease  = "I"

# Mixer — Deck 3
deck3_level_up          = "l"
deck3_level_down        = "."
deck3_level_max         = "space+l"
deck3_level_min         = "space+."
deck3_gain_increase     = "L"
deck3_gain_decrease     = ">"
deck3_filter_increase        = "9"
deck3_filter_decrease        = "o"
deck3_filter_reset           = ["space+9", "space+o"]
deck3_filter_slope_increase  = "("
deck3_filter_slope_decrease  = "O"

# Deck swap
swap_deck1_deck2 = "space+="
swap_deck2_deck3 = "space+-"

[display]
playhead_position = 20        # 0–100, percentage from left edge of detail panel
warning_threshold_secs = 30   # seconds before end to activate bar-marker flash warning
detail_height = 5             # total rows per detail waveform (including 2-row tick area; min 4)
# target_fps = 60             # frame rate cap; snapped to nearest level: 15, 20, 24, 30, 45, 60, 90, 120, 240

[messages]
retention_days = 90           # how long messages.log keeps history
